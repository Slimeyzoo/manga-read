<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manga Reader</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    text-align: center;
  }
  h1 {
    margin-bottom: 1rem;
  }
  .reader-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    position: relative;
  }
  button {
    padding: 0.5rem 1.2rem;
    font-size: 1rem;
    border-radius: 5px;
    border: none;
    background-color: #2d89ef;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
    min-width: 80px;
  }
  button:disabled {
    background-color: #aaa;
    cursor: default;
  }
  button:hover:not(:disabled) {
    background-color: #1b5fbd;
  }
  img.page {
    max-width: none; /* WICHTIG für Zoom */
    max-height: none; /* WICHTIG für Zoom */
    width: 700px; /* feste Breite für besseres Zoomen */
    height: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    border-radius: 8px;
    cursor: zoom-in;
    transition: transform 0.3s ease;
  }
  img.page.zoomed {
    cursor: zoom-out;
  }
  .back-link {
    display: block;
    margin-bottom: 1rem;
    text-decoration: none;
    color: #2d89ef;
  }
  #fullscreen-btn {
    position: absolute;
    top: -2.5rem;
    right: 0;
    background-color: #4caf50;
  }
</style>
</head>
<body>
  <a href="manga.html?manga=${encodeURIComponent(mangaTitle)}" class="back-link" id="back-link">&larr; Zurück zur Kapitel-Liste</a>
  <h1 id="title">Lade...</h1>

  <div class="reader-container" id="reader-container">
    <button id="prev-btn">← Zurück</button>
    <img id="page-image" class="page" src="" alt="Manga Seite" />
    <button id="next-btn">Weiter →</button>
  </div>

<script>
function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

const mangaTitle = getQueryParam('manga');
const chapterTitle = getQueryParam('chapter');

const titleEl = document.getElementById('title');
const pageImage = document.getElementById('page-image');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const backLink = document.getElementById('back-link');

if (!mangaTitle || !chapterTitle) {
  titleEl.textContent = 'Manga oder Kapitel nicht angegeben.';
  pageImage.style.display = 'none';
  prevBtn.disabled = true;
  nextBtn.disabled = true;
} else {
  backLink.href = `manga.html?manga=${encodeURIComponent(mangaTitle)}`;

  fetch('manga.json')
    .then(res => {
      if (!res.ok) throw new Error('Konnte manga.json nicht laden');
      return res.json();
    })
    .then(data => {
      const manga = data.manga.find(m => m.title === mangaTitle);
      if (!manga) throw new Error('Manga nicht gefunden.');

      const chapter = manga.chapters.find(c => c.title === chapterTitle);
      if (!chapter) throw new Error('Kapitel nicht gefunden.');

      titleEl.textContent = `${mangaTitle} - ${chapterTitle}`;

      const pages = chapter.pages;
      if (!pages || pages.length === 0) {
        titleEl.textContent = 'Keine Seiten für dieses Kapitel vorhanden.';
        pageImage.style.display = 'none';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      let currentPageIndex = 0;
      pageImage.src = pages[currentPageIndex];
      pageImage.alt = `${mangaTitle} - ${chapterTitle} Seite ${currentPageIndex + 1}`;

      function updateButtons() {
        prevBtn.disabled = currentPageIndex === 0;
        nextBtn.disabled = currentPageIndex === pages.length - 1;
      }
      updateButtons();

      prevBtn.onclick = () => {
        if (currentPageIndex > 0) {
          currentPageIndex--;
          pageImage.src = pages[currentPageIndex];
          pageImage.alt = `${mangaTitle} - ${chapterTitle} Seite ${currentPageIndex + 1}`;
          resetZoom();
          updateButtons();
        }
      };

      nextBtn.onclick = () => {
        if (currentPageIndex < pages.length - 1) {
          currentPageIndex++;
          pageImage.src = pages[currentPageIndex];
          pageImage.alt = `${mangaTitle} - ${chapterTitle} Seite ${currentPageIndex + 1}`;
          resetZoom();
          updateButtons();
        }
      };
    })
    .catch(err => {
      titleEl.textContent = 'Fehler beim Laden der Seiten.';
      pageImage.style.display = 'none';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      console.error(err);
    });
}

// Zoom & Fullscreen Logik für das Bild
let scale = 1;
const scaleStep = 0.1;
const maxScale = 3;
const minScale = 1;

function resetZoom() {
  scale = 1;
  pageImage.style.transform = `scale(1)`;
  pageImage.classList.remove('zoomed');
}

// Klick auf Bild: Fullscreen toggeln
pageImage.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    pageImage.requestFullscreen().catch(err => {
      console.error('Fullscreen Fehler:', err);
    });
  } else {
    document.exitFullscreen();
  }
});

// Zoom nur im Fullscreen mit Mausrad
pageImage.addEventListener('wheel', (event) => {
  const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

  if (!isFullscreen) {
    return; // Kein Zoom außerhalb Fullscreen
  }

  const rect = pageImage.getBoundingClientRect();
  const x = event.clientX;
  const y = event.clientY;

  if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
    event.preventDefault();

    const delta = event.deltaY > 0 ? -scaleStep : scaleStep;
    scale = Math.min(maxScale, Math.max(minScale, scale + delta));

    pageImage.style.transform = `scale(${scale})`;

    if (scale > 1) {
      pageImage.classList.add('zoomed');
    } else {
      pageImage.classList.remove('zoomed');
    }
  }
}, { passive: false });

// Zoom zurücksetzen, wenn Fullscreen beendet wird
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    resetZoom();
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manga Liste mit Cover</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 {
    text-align: center;
    margin-bottom: 2rem;
  }
  ul {
    list-style: none;
    padding-left: 0;
  }
  li {
    display: flex;
    align-items: center;
    background: #eee;
    margin-bottom: 1rem;
    padding: 0.8rem;
    border-radius: 6px;
    transition: background 0.3s;
  }
  li:hover {
    background: #ddd;
  }
  img.cover {
    width: 80px;
    height: 120px;
    object-fit: cover;
    border-radius: 4px;
    margin-right: 1rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }
  a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
    font-size: 1.2rem;
  }
</style>
</head>
<body>
  <h1>Meine Manga Sammlung</h1>
  <ul id="manga-list">
    <li>Lade Manga...</li>
  </ul>

<script>
// JSON-Datei mit Manga-Daten laden und Liste anzeigen
fetch('manga.json')
  .then(res => {
    if (!res.ok) throw new Error('Konnte manga.json nicht laden');
    return res.json();
  })
  .then(data => {
    const list = document.getElementById('manga-list');
    list.innerHTML = ''; // leeren

    data.manga.forEach(manga => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      const img = document.createElement('img');

      a.href = `kapitel.html?manga=${encodeURIComponent(manga.title)}`; // Link zum Kapitel-Reader setzen
      a.textContent = manga.title;

      img.src = manga.cover || 'placeholder.png'; // Fallback-Bild, falls kein Cover angegeben
      img.alt = manga.title + ' Cover';
      img.className = 'cover';

      li.appendChild(img);
      li.appendChild(a);
      list.appendChild(li);
    });
  })
  .catch(err => {
    document.getElementById('manga-list').textContent = 'Fehler beim Laden der Manga-Liste.';
    console.error(err);
  });
</script>

</body>
</html>
